[package]
name = "luvcs-protocol"
description = "Wire types between luvcs and a remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["config"]
# `RemoteConfig`: the eure form of "how to reach a remote".
config = ["dep:eure"]

[dependencies]
serde = { workspace = true }
eure = { version = "0.1.6", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
