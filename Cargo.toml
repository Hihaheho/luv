[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
uniffi = "0.31.1"
